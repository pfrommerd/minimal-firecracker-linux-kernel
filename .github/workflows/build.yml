name: Build and release kernel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: kernel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build kernel
        run: make build

      - name: Publish kernel release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          kernels=(kernel-output/vmlinux-*-firecracker-minimal)
          if [[ ${#kernels[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one kernel image; found ${#kernels[@]}."
            exit 1
          fi
          kernel="${kernels[0]}"
          if [[ ! -f "$kernel" || ! -s "$kernel" ]]; then
            echo "::error::Kernel image is missing or empty."
            exit 1
          fi

          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$is_draft" != true ]]; then
              echo "::error::Release $RELEASE_TAG is already published."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes
          fi

          gh release upload "$RELEASE_TAG" "$kernel" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
