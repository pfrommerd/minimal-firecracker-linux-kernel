name: Build and release kernel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: kernel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} kernel
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: vmlinux
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: Image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check build and release helpers
        run: python3 -m unittest discover -s tests -v

      - name: Build kernel
        env:
          ARCH: ${{ matrix.arch }}
        run: make build

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: kernel-output/${{ matrix.image }}-*-firecracker-minimal-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download x86_64 kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64
          path: kernel-output

      - name: Download aarch64 kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-aarch64
          path: kernel-output

      - name: Publish kernel release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          x86_kernels=(kernel-output/vmlinux-*-firecracker-minimal-x86_64)
          arm_kernels=(kernel-output/Image-*-firecracker-minimal-aarch64)
          if [[ ${#x86_kernels[@]} -ne 1 || ${#arm_kernels[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one kernel image per architecture."
            exit 1
          fi
          kernels=("${x86_kernels[0]}" "${arm_kernels[0]}")
          for kernel in "${kernels[@]}"; do
            if [[ ! -f "$kernel" || ! -s "$kernel" ]]; then
              echo "::error::Kernel image $kernel is missing or empty."
              exit 1
            fi
          done
          version=${x86_kernels[0]#kernel-output/vmlinux-}
          version=${version%-firecracker-minimal-x86_64}
          if [[ "${arm_kernels[0]}" != "kernel-output/Image-$version-firecracker-minimal-aarch64" ]]; then
            echo "::error::Kernel versions do not match."
            exit 1
          fi

          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$is_draft" != true ]]; then
              echo "::error::Release $RELEASE_TAG is already published."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes
          fi

          gh release upload "$RELEASE_TAG" "${kernels[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
